# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored in the repo.
#
#   Trigger                                     Result
#   ------------------------------------------  ---------------------------------------------
#   Actions > Publish > Run workflow (manual)   dry run: CI + release checks + build + smoke
#                                               tests, nothing is uploaded
#   GitHub pre-release, tag vX.Y.ZrcN           pre-publication: X.Y.ZrcN on PyPI (pip only
#                                               installs it when pinned: ==X.Y.ZrcN)
#   GitHub release, tag vX.Y.Z                  X.Y.Z on PyPI
#
# Every upload waits for approval on the "pypi" environment and is then verified by
# installing it from PyPI in a clean environment.
#
# One-time setup:
#   1. https://pypi.org/manage/account/publishing/ > "Add a new pending publisher":
#      project reflex-vercel-analytics, owner ecrespo, repository reflex-vercel-analytics,
#      workflow publish.yml, environment pypi.
#   2. GitHub > Settings > Environments: create "pypi" with required reviewers.
#
# Full procedure: README.md > Development > Releasing.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One publication per ref at a time; never cancel an upload half-way.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.7"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: check release + build
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked

      - name: Release metadata (tag, pre-release flag, changelog, not yet on PyPI)
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            uv run python scripts/check_release.py --tag "$TAG" --prerelease "$PRERELEASE" --check-pypi
          else
            uv run python scripts/check_release.py --check-pypi
          fi

      - id: version
        run: |
          version=$(uv version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### reflex-vercel-analytics $version" >> "$GITHUB_STEP_SUMMARY"

      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Smoke-test the built distributions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for dist in dist/*.whl dist/*.tar.gz; do
            uv run --isolated --no-project --with "$dist" python -I scripts/smoke_test.py --version "$VERSION"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-vercel-analytics/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify-pypi:
    name: verify install from PyPI
    needs: [build, pypi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install from PyPI and smoke test
        run: |
          for attempt in $(seq 1 20); do
            if uv run --isolated --no-project --refresh --with "reflex-vercel-analytics==$VERSION" \
                 python -I scripts/smoke_test.py --version "$VERSION"; then
              exit 0
            fi
            echo "not installable from PyPI yet (attempt $attempt), retrying in 15 s"; sleep 15
          done
          echo "::error::reflex-vercel-analytics $VERSION could not be installed from PyPI"; exit 1
